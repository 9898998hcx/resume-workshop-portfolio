# 阶段一示例：将本文件放入 Nginx 配置目录后，根据域名和 HTTPS 证书调整。
# 人机验证必须由 FastAPI 校验，Nginx 只负责代理和限流。

http {
    limit_req_zone $binary_remote_addr zone=api_general:10m rate=30r/m;
    limit_req_zone $binary_remote_addr zone=api_auth:10m rate=5r/m;

    server {
        listen 80;
        server_name resume.example.com;
        client_max_body_size 1m;

        location /api/auth/phone/ {
            limit_req zone=api_auth burst=2 nodelay;
            proxy_pass http://127.0.0.1:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/ {
            limit_req zone=api_general burst=10 nodelay;
            proxy_pass http://127.0.0.1:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /health {
            proxy_pass http://127.0.0.1:8000;
            proxy_set_header Host $host;
        }

        # 前端仍由 Next.js 提供；生产时可改为 proxy_pass 127.0.0.1:3000。
        location / {
            proxy_pass http://127.0.0.1:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
